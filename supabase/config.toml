[functions.external-api]
verify_jwt = false

[functions.automation-worker]
verify_jwt = false

[functions.automation-incoming-webhook]
verify_jwt = false

[functions.google-oauth-callback]
verify_jwt = false

[functions.website-builder]
enabled = true
verify_jwt = false
import_map = "./functions/website-builder/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/website-builder/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/website-builder/*.html" ]

[functions.website-form-submit]
verify_jwt = false

[functions.website-public]
verify_jwt = false
